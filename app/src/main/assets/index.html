<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محاسبه‌گر کنتور آب</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f0f5fa;color:#18324c;margin:0;padding:18px}main{max-width:650px;margin:auto}h1{text-align:center;font-size:23px}section{background:white;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 3px 15px #152b4512}h2{font-size:18px;margin-top:0}label{display:block;margin:12px 0 6px}input,select{width:100%;box-sizing:border-box;border:1px solid #b9cddd;border-radius:9px;padding:12px;font-size:17px;background:white;color:#123}input{direction:ltr;text-align:left}.result{background:#eaf5ff;border-radius:12px;padding:14px;margin-top:16px;line-height:2}strong{font-size:21px;color:#075aa4}.note{font-size:12px;color:#60758a}footer{text-align:center;font-size:12px;color:#60758a}</style></head><body><main><h1>💧 محاسبه‌گر کنتور آب</h1><section><h2>۱. محاسبه خطای کنتور</h2><label>حجم واقعی (لیتر)</label><input id="actual" type="number" min="0" step="any" value="100"><label>حجم ثبت‌شده کنتور (لیتر)</label><input id="meter" type="number" min="0" step="any" value="102"><div class="result">درصد خطا: <strong id="error">—</strong><div id="interpret"></div></div><p class="note">خطا = (حجم کنتور − حجم واقعی) ÷ حجم واقعی × ۱۰۰</p></section><section><h2>۲. محاسبه دبی</h2><label>حجم آب عبوری (لیتر)</label><input id="volume" type="number" min="0" step="any" value="100"><label>زمان تست (ثانیه)</label><input id="seconds" type="number" min="0" step="any" value="60"><div class="result">دبی: <strong id="lph">—</strong> لیتر بر ساعت<br><strong id="m3h">—</strong> مترمکعب بر ساعت</div></section><section><h2>۳. محاسبه حجم عبوری از دبی و زمان</h2><label>دبی</label><input id="flow" type="number" min="0" step="any" value="3000"><label>واحد دبی</label><select id="flowunit"><option value="lph">لیتر بر ساعت (L/h)</option><option value="m3h">مترمکعب بر ساعت (m³/h)</option></select><label>زمان (ثانیه)</label><input id="duration" type="number" min="0" step="any" value="60"><div class="result">حجم عبوری: <strong id="outliters">—</strong> لیتر<br><strong id="outm3">—</strong> مترمکعب</div></section><footer>نتایج محاسباتی هستند و به‌تنهایی تأییدیه استاندارد نیستند.</footer></main><script>const el=id=>document.getElementById(id);const n=id=>{let s=el(id).value.trim();return s===''?NaN:Number(s)};const fmt=(v,d=2)=>Number.isFinite(v)?v.toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d}):'—';function update(){let a=n('actual'),m=n('meter');if(a>0&&m>=0){let e=(m-a)/a*100;el('error').textContent=(e>0?'+':'')+fmt(e)+'٪';el('interpret').textContent=e>0?'کنتور بیشتر از مقدار واقعی ثبت کرده':e<0?'کنتور کمتر از مقدار واقعی ثبت کرده':'بدون خطا'}else{el('error').textContent='—';el('interpret').textContent='حجم واقعی باید مثبت و حجم کنتور نامنفی باشد'}let v=n('volume'),t=n('seconds');let q=v>=0&&t>0?v*3600/t:NaN;el('lph').textContent=fmt(q);el('m3h').textContent=fmt(q/1000,3);let f=n('flow'),s=n('duration'),l=f>=0&&s>0?f*(el('flowunit').value==='m3h'?1000:1)*s/3600:NaN;el('outliters').textContent=fmt(l,3);el('outm3').textContent=fmt(l/1000,6)}document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',update));update();</script></body></html>
